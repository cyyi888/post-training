# @package _global_
defaults:
  - model: qwen2.5-7b
  - data: gsm8k
  - training: sft
  - eval: default
  - _self_

seed: 12
output_dir: outputs
hf_endpoint: https://hf-mirror.com
use_gpu: true
report_to: none  # none | wandb | tensorboard

hydra:
  run:
    dir: ${output_dir}/logs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output_dir}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
