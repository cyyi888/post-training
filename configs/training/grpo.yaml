algorithm: grpo
output_subdir: checkpoints/grpo
learning_rate: 2.0e-6
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_generations: 4
max_completion_length: 256
temperature: 0.9
# 自研 GRPO：clip 与参考模型 KL
clip_range: 0.2
beta: 0.04
num_iterations: 1
max_steps: null
logging_steps: 5
save_strategy: no
gradient_checkpointing: false
reward:
  funcs:
    - accuracy
    - format
  weights: [1.0, 0.2]
