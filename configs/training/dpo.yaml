algorithm: dpo
output_subdir: checkpoints/dpo
learning_rate: 5.0e-5
num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: false
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
max_length: 1024
max_prompt_length: 512
max_steps: null

# 自研损失：dpo | ipo
loss_type: dpo
# IPO 合页 margin
margin: 1.0

# β 口径：beta_mode + fixed_beta + dynamic_beta{...}（勿再用顶层 beta / bool dynamic_beta）
beta_mode: dynamic  # fixed | dynamic
fixed_beta: 0.1
dynamic_beta:
  init_beta: 0.1
  target_kl: 4.0
  adjust_rate: 0.1
  min_beta: 0.01
  max_beta: 1.0

label_smoothing: 0.0
reference_free: false
penalty:
  enabled: false
  type: none
  weight: 0.0
