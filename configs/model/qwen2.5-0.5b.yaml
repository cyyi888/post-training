# LoRA 基线（推荐 0.5 GPU / 小显存）
name: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true
torch_dtype: bfloat16
use_lora: true
lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  bias: none
  task_type: CAUSAL_LM
max_seq_length: 1024
