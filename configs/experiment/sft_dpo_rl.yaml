# @package _global_
# SFT → DPO → RL 完整链路（scripts/pipeline.py）
defaults:
  - /base
  - override /wandb: disabled
  - _self_

pipeline:
  name: sft_dpo_rl
  # 冒烟步数；正式训练覆盖为 null：pipeline.max_steps=null
  max_steps: 20
  # 末段：grpo（自研在线 RL 主路径）或 ppo（TRL 对照）
  rl_algorithm: grpo
  # 默认 true，避免误启完整链路；真实冒烟请显式 pipeline.dry_run=false
  dry_run: true
  stages:
    - name: sft
      overrides:
        - training=sft
        - data=gsm8k
    - name: dpo
      init_from: sft
      overrides:
        - training=dpo
        - data=dpo_demo
    - name: rl
      init_from: dpo
      # training= 由 rl_algorithm 注入；此处只补数据等
      overrides:
        - data=gsm8k
